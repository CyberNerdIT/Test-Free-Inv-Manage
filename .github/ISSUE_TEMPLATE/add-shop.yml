name: Add my shop to the community directory
description: List a Tech Garage so nearby shops can link to it
title: "Add shop: "
labels: ["directory"]
body:
  - type: markdown
    attributes:
      value: |
        Your entry is generated for you: **Admin → Community directory → Copy registry entry**.

        Before submitting, check that your shop is publicly reachable and that
        `https://your-shop/api/directory/verify` returns your node id — a reviewer
        will check the same thing, and the CI job checks it automatically.

        **This is public and permanent.** The registry lives in a public git
        repository, so your shop name, URL and coarse region become part of its
        history. Removing your entry later removes it from the current file, but
        not from past commits. Please don't submit anything you would mind being
        on the internet indefinitely.
  - type: textarea
    id: entry
    attributes:
      label: Registry entry
      description: Paste the JSON block from your admin page, unedited.
      render: json
      placeholder: |
        {
          "node": "MCowBQYDK2Vw...",
          "name": "Ann's Tech Garage",
          "url": "https://shop.example",
          "region": { "country": "US", "state": "NY", "area": "Brooklyn" },
          "categories": ["laptop", "ram"],
          "added": "2026-08-04"
        }
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I run this shop and control the URL above.
          required: true
        - label: The shop is publicly browsable (guest browsing on, or a public site).
          required: true
        - label: I understand this entry is public and stays in the repository's git history.
          required: true
